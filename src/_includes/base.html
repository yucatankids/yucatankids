<!DOCTYPE html>
<html lang="{{ 'es' if (lang == 'es' or (tags and 'es' in tags)) else page.lang }}">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="canonical" href="https://www.yucatankidsmx.org/{{ page.fileSlug }}">

    <meta name="description" content="{{ description }}">
    <meta name="keywords" content="">

    <!--Social Media Display-->
    <meta property="og:title" content="{{ metaTitle }}" />
    <meta property="og:description" content="{{ description }}" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="{{ canonical }}" />
    <!-- <meta property="og:image" content="assets/images/social.jpg"/>
    <meta property="og:image:secure_url" content="assets/images/social.jpg"/> -->

    <!--Favicons-->
    <link rel="icon" type="image/png" href="/assets/favicon_io/favicon-96x96.png?v=20260511" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/assets/favicon_io/favicon.svg?v=20260511" />
    <link rel="shortcut icon" href="/assets/favicon_io/favicon.ico?v=20260511" />
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/favicon_io/apple-touch-icon.png?v=20260511" />
    <meta name="apple-mobile-web-app-title" content="MyWebSite" />
    <link rel="manifest" href="/assets/favicon_io/site.webmanifest?v=20260511" />


    <!-- Preload -->
    {{ preload | safe }}
    <link rel="preload" as="font" type="font/woff2" href="/assets/fonts/roboto-v29-latin-regular.woff2" crossorigin>
    <link rel="preload" as="font" type="font/woff2" href="/assets/fonts/roboto-v29-latin-700.woff2" crossorigin>

    <link rel="stylesheet" href="/css/root.css">
    <link rel="stylesheet" href="/css/dark.css">
    <link rel="stylesheet" href="/css/es.css">

    <!-- Loading in page specific CSS sheets from css block -->
    {{ pageCSS | safe }}

    <!-- analytics tag is here at the bottom to prevent it from render blocking-->

    <title>{{ tagTitle }}</title>
</head>

<body>
    <!--Screen reader skip main nav-->
    <a class="skip" aria-label="skip to main content" href="#main">Click To Skip To Main Content</a>

    {% include "header.html" %}
    <main id="main">{{ content | safe }}</main>
    {% include "footer.html" %}

    <script defer src="/assets/js/nav.js"></script>
    <script defer src="/assets/js/dark.js"></script>
    <script defer src="/assets/js/es.js"></script>
    {{ pageJS | safe }}

    <!--
        This script adds a class to the body after scrolling 100px
        and we used these body.scroll styles to create some on scroll 
        animations with the navbar
    -->
    <script defer>
        let scrollPending = false;
        document.addEventListener('scroll', () => {
            if (scrollPending) return;
            scrollPending = true;
            requestAnimationFrame(() => {
                document.body.classList.toggle('scroll', document.documentElement.scrollTop >= 100);
                scrollPending = false;
            });
        });
    </script>

</body>

</html>
